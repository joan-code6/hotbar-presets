name: Build and Release Jar

on:
  push:
    branches:
      - copilot/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Locate release jar
        id: locate_jar
        run: |
          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          if [ -z "$JAR_PATH" ]; then
            echo "No release jar found in build/libs"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "auto-release-${{ github.run_id }}"
          name: "Auto Release ${{ github.run_id }}"
          generate_release_notes: true
          files: ${{ steps.locate_jar.outputs.jar_path }}
